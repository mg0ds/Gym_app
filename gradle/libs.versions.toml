[versions]
# AGP 9.x ma wbudowane wsparcie Kotlina (nie dodajemy pluginu org.jetbrains.kotlin.android).
# Plugin Compose (org.jetbrains.kotlin.plugin.compose) wnosi na classpath Kotlin Gradle
# Plugin w wersji z `kotlin`, dlatego ta wersja jest realnie używana przez build.
agp = "9.4.1"
kotlin = "2.3.21"
# Od KSP 2.3.0 wersja KSP nie jest już sklejona z wersją Kotlina (osobne numerowanie).
ksp = "2.3.12"

# UWAGA (stan 2026-10): najnowsze wydania androidx (compose 1.12.x, core-ktx 1.19.x,
# lifecycle 2.11.x, navigation 2.10.x, hilt-navigation-compose 1.4.x) wymagają
# compileSdk 37 (Android 17). Plan aplikacji zakłada compileSdk 36, dlatego
# świadomie bierzemy ostatnie wydania wspierające 36 (minCompileSdk <= 36).
# Podniesienie: compileSdk = 37 + compileSdkMinor + te biblioteki o jedną linię w górę.
composeBom = "2026.06.01"   # compose 1.11.4 + material3 1.4.0 (minCompileSdk 35)
activityCompose = "1.13.0"  # minCompileSdk 36
coreKtx = "1.18.0"          # 1.19.0+ wymaga compileSdk 37
lifecycle = "2.10.0"        # 2.11.0+ wymaga compileSdk 37
navigation = "2.9.6"        # 2.10.x wymaga compileSdk 37

hilt = "2.60.1"
hiltNavigationCompose = "1.3.0"  # 1.4.0 wymaga compileSdk 37
room = "2.8.5"
datastore = "1.2.1"

junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Wersje bibliotek Compose pochodzą z BOM (platform(...)) - nie podajemy ich tutaj.
# Uwaga: żaden alias nie może być prefiksem innego (inaczej accessor `libs.x.y`
# jest niejednoznaczny) - dlatego `compose-graphics`, a nie `compose-ui-graphics`.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

junit4 = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
